name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: downstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/downstack_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t downstack-ci .
      - name: Verify non-root container startup
        run: |
          docker run -d --name downstack-ci -e ALLOW_SQLITE_IN_PRODUCTION=1 -p 127.0.0.1:3000:3000 downstack-ci
          trap 'docker logs downstack-ci; docker rm -f downstack-ci' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/api/ready
